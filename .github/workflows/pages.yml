# The site is one page, written by hand. There is nothing to build, so nothing
# is built — except the engine, because the page quotes it, and a quotation
# that is no longer true does not get published.
name: site

on:
  push:
    branches: [main]
    paths: ['site/**', 'include/**', 'apps/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The engine builds, and every physical claim it makes still holds. Both
      # of those are portable, so both are checked here.
      - run: make
      - run: ./windsor verify

      # `site/tools/plates --check` is NOT run here, and the reason is worth
      # writing down. It compares the page against the program's output
      # character for character, and that output is not reproducible across
      # platforms: nine seconds of sin, exp and pow through a different libm
      # diverge in the last digit, which is enough to move a printed 0.6983 and
      # to flip one character of a plot at a rounding boundary. The plates were
      # set on the author's machine and can only be checked there, so the check
      # is an authoring step — run it before committing. What CI can establish
      # is that the engine still passes its own sixty-three, and it does that
      # above.

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
