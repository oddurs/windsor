# The site is one page, written by hand. There is nothing to build, so nothing
# is built — except the engine, because the page quotes it, and a quotation
# that is no longer true does not get published.
name: site

on:
  push:
    branches: [main]
    paths: ['site/**', 'include/**', 'apps/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Builds the engine and compares every line the page quotes against what
      # the source says and the program prints.
      - run: site/tools/check

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
